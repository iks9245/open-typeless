name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and tests
    # The app targets macOS: native modules, Electron and code signing are verified there
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests (Electron)
        run: pnpm test:integration

      - name: Restore whisper-server build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/whisper.cpp
            resources/bin
          key: whisper-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-whisper-server.sh') }}

      - name: Build whisper-server
        run: |
          command -v cmake >/dev/null || { echo '::error::cmake is required to build whisper-server'; exit 1; }
          bash scripts/build-whisper-server.sh

      - name: Package
        run: pnpm package

      - name: Verify package
        run: pnpm verify:package
